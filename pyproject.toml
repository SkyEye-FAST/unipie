[project]
name = "unipie"
version = "0.1.0"
description = "A terminal pixel editor and glyph library for GNU Unifont"
authors = [{ name = "SkyEye_FAST", email = "skyeyefast@foxmail.com" }]
requires-python = ">=3.10,<4.0"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = ["unifont-utils>=0.7.0", "textual>=6.11,<7", "pillow>=10", "rich>=13.9"]

[project.scripts]
unipie = "unipie.cli:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["hatchling>=1.27,<2", "pytest>=8.4", "ruff>=0.12"]

[tool.pytest.ini_options]
addopts = ["-ra", "--strict-config", "--strict-markers"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["B", "C4", "E", "F", "I", "N", "PERF", "SIM", "UP", "W"]

[tool.ruff.format]
line-ending = "lf"
